<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <base href="/" />
        <title>Sonia Pujol Lab</title>
        <meta name="theme-color" content="#003366" />
        <link rel="icon" type="image/svg+xml" href="public/assets/img/icon.svg" />
        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="public/assets/fonts/roboto-latin-wght-normal.woff2"
            crossorigin
        />
        <script>
            (function () {
                try {
                    var stored = localStorage.getItem('soniapujollab_theme');
                    document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
                } catch (e) {
                    document.documentElement.dataset.theme = 'light';
                }
            })();
        </script>
    </head>
    <body>
        <app-root></app-root>
    </body>
</html>
