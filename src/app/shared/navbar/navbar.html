<a class="skip-link" [routerLink]="[]" fragment="main">Skip to content</a>
<header class="app-navbar">
    <div class="container app-navbar__inner">
        <a class="brand" routerLink="/">
            <img src="public/assets/img/icon.svg" alt="" width="44" height="44" />
            Sonia Pujol Lab
        </a>
        <nav class="app-navbar__nav" aria-label="Primary" [attr.data-open]="navOpen()">
            @for (link of links; track link.key) {
                <a
                    class="nav-link-item"
                    [routerLink]="link.href"
                    [attr.aria-current]="link.key === active() ? 'page' : null"
                    (click)="navOpen.set(false)"
                    >{{ link.label }}</a
                >
            }
        </nav>
        <div class="app-navbar__actions">
            <button
                type="button"
                class="icon-button theme-toggle"
                aria-label="Toggle dark mode"
                [attr.aria-pressed]="themes.theme() === 'dark'"
                (click)="themes.toggle()"
            >
                <svg
                    class="theme-toggle__sun"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    aria-hidden="true"
                >
                    <circle cx="12" cy="12" r="4" />
                    <path
                        d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                    />
                </svg>
                <svg
                    class="theme-toggle__moon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
                </svg>
            </button>
            <button
                type="button"
                class="icon-button nav-toggle"
                aria-label="Toggle navigation"
                [attr.aria-expanded]="navOpen()"
                (click)="toggleNav()"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    aria-hidden="true"
                >
                    @if (navOpen()) {
                        <path d="m6 6 12 12M18 6 6 18" />
                    } @else {
                        <path d="M4 7h16M4 12h16M4 17h16" />
                    }
                </svg>
            </button>
        </div>
    </div>
</header>
